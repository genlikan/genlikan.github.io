remote_theme: daattali/beautiful-jekyll@6.0.1

title: Jacob 'Gen' Yoon
author: Jacob Yoon Zeng Yew
description: Founding Forward Deployed AI Engineer at StackAI

navbar-links:
  About Me: "aboutme"
  Resume: "https://genlikan.github.io/online-cv/"

avatar: "/assets/img/GN_logo.png"
round-avatar: false

social-network-links:
  email: "jacobyoonzengyew@gmail.com"
  github: genlikan
  linkedin: jacob-zy-yoon

share-links-active:
  twitter: false
  facebook: false
  linkedin: true
  vk: false

url-pretty: "genlikan.github.io"

navbar-col: "#161B22"
navbar-text-col: "#E6EDF3"
navbar-border-col: "#30363D"
page-col: "#0D1117"
text-col: "#C9D1D9"
link-col: "#5CC8B5"
hover-col: "#8FE3D4"
footer-col: "#161B22"
footer-text-col: "#8B949E"
footer-link-col: "#C9D1D9"
footer-hover-col: "#5CC8B5"
mobile-theme-col: "#0D1117"

site-css:
  - "/assets/css/dark.css"

title-separator: "-"
date_format: "%B %-d, %Y"
timezone: "America/New_York"

markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5
kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"
      show-avatar: true

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
